# gitlab-custom-login-page on Kubernetes ("path mode").
# Your existing GitLab Ingress is NOT modified: the extra Ingress below adds three more specific
# paths for the same host, and the ingress controller merges them.
# Edit the places marked with  # <--  then:  kubectl apply -n gitlab -f login-skin.yaml
# Rollback:  kubectl -n gitlab delete ingress gitlab-login-skin
apiVersion: v1
kind: Secret
metadata: { name: gitlab-login-skin }
stringData:
  token: ""          # <-- optional: token with read_api scope; empty = only public projects
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gitlab-login-skin }
spec:
  replicas: 1
  selector: { matchLabels: { app: gitlab-login-skin } }
  template:
    metadata: { labels: { app: gitlab-login-skin } }
    spec:
      containers:
        - name: login-skin
          image: ghcr.io/ar4ikov/gitlab-custom-login-page:latest
          ports: [{ containerPort: 8080 }]
          env:
            # GitLab Workhorse service of the official Helm chart             # <--
            - { name: GITLAB_UPSTREAM, value: "http://gitlab-webservice-default:8181" }
            # Workhorse is plain http inside the cluster: tell the API which host we mean
            - { name: LOGO_API_HOST, value: "gitlab.example.com" }             # <--
            - { name: GITLAB_TOKEN_FILE, value: /run/secrets/login-skin/token }
            - { name: LOGO_VISIBILITY, value: "public" }   # public | internal | all | none
            - { name: SKIN_CONCEPT, value: "random" }
          readinessProbe: { httpGet: { path: /-/login-skin/healthz, port: 8080 } }
          livenessProbe:  { httpGet: { path: /-/login-skin/healthz, port: 8080 } }
          resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { memory: 96Mi } }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 101 }
          volumeMounts:
            - { name: logos, mountPath: /var/lib/login-skin/logos }
            - { name: token, mountPath: /run/secrets/login-skin, readOnly: true }
            # - { name: custom, mountPath: /logos-custom, readOnly: true }   # your own images / pinned.png
      volumes:
        - { name: logos, emptyDir: {} }
        - { name: token, secret: { secretName: gitlab-login-skin } }
        # - { name: custom, configMap: { name: gitlab-login-skin-custom } }
---
apiVersion: v1
kind: Service
metadata: { name: gitlab-login-skin }
spec:
  selector: { app: gitlab-login-skin }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab-login-skin
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
spec:
  ingressClassName: nginx                                                     # <--
  tls: [{ hosts: [gitlab.example.com], secretName: gitlab-web-tls }]           # <-- same as your GitLab ingress
  rules:
    - host: gitlab.example.com                                                # <--
      http:
        paths:
          - { path: /users/sign_in,  pathType: Exact,  backend: { service: { name: gitlab-login-skin, port: { number: 8080 } } } }
          - { path: /-/login-skin/,  pathType: Prefix, backend: { service: { name: gitlab-login-skin, port: { number: 8080 } } } }
          # optional: the blurred corner picture inside GitLab (remove this path to keep the stock one)
          - { path: /assets/blooms/, pathType: Prefix, backend: { service: { name: gitlab-login-skin, port: { number: 8080 } } } }
